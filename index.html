<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week Project — Settimana III</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <!-- Titolo dell'app + sottotitolo + button tema chiaro/scuro -->
      <div class="header-content">
        <h1>La mia anime watchlist</h1>
        <p>
          Aggiungi gli anime che hai visto, che stai guardando o che vuoi vedere
        </p>
        <button id="toggle-theme">Tema scuro</button>
      </div>
    </header>

    <main>
      <!-- Form di inserimento di nuovi elementi -->
      <div class="form-container">
        <section class="form">
          <h2>Aggiungi un anime</h2>
          <form id="form-anime">
            <div class="form-row">
              <input
                type="text"
                id="input-titolo"
                placeholder="Titolo"
              />
              <select id="input-stato">
                <option disabled selected>Stato</option>
                <option value="Da vedere">Da vedere</option>
                <option value="In visione">In visione</option>
                <option value="Visto">Visto</option>
              </select>
              <input
                type="number"
                id="input-voto"
                placeholder="Voto"
                min="1"
                max="10"
              />
              <select id="input-categoria">
                <option disabled selected>Categoria</option>
                <option value="Shonen">Shonen</option>
                <option value="Shojo">Shojo</option>
                <option value="Seinen">Seinen</option>
                <option value="Mecha">Mecha</option>
                <option value="Isekai">Isekai</option>
                <option value="Slice of Life">Slice of Life</option>
              </select>
            </div>
            <button type="submit" id="btn-aggiungi">Aggiungi</button>
          </form>
        </section>
      </div>
      <!-- Ricerca live, filtro (select), ordinamento -->
      <div class="filtri-container">
        <section class="filtri">
          <h2>Filtra ed ordina</h2>
          <input
            type="text"
            id="input-ricerca"
            placeholder="Cerca per titolo"
          />
          <select id="filtro-stato">
            <option value="Tutti">Tutti</option>
            <option value="Da vedere">Da vedere</option>
            <option value="In visione">In visione</option>
            <option value="Visto">Visto</option>
          </select>
          <select id="ordinamento">
            <option value="titolo-asc">Titolo A→Z</option>
            <option value="titolo-desc">Titolo Z→A</option>
            <option value="voto-desc">Voto decrescente</option>
            <option value="voto-asc">Voto crescente</option>
          </select>
        </section>
      </div>
      <div class="statistiche-container">
        <section class="statistiche">
          <div class="stat">
            <span id="stat-visti">0</span>
            <p>Visti</p>
          </div>
          <div class="stat">
            <span id="stat-in-visione">0</span>
            <p>In visione</p>
          </div>
          <div class="stat">
            <span id="stat-da-vedere">0</span>
            <p>Da vedere</p>
          </div>
          <div class="barra-container">
            <div id="barra-visti"></div>
          </div>
        </section>
      </div>

      <section class="lista">
        <!-- Container che render() ricostruisce a ogni cambio di stato -->
      </section>

      <div id="notifica"></div>
    </main>

    <footer>
      <!-- Autore, anno -->
    </footer>

    <script src="assets/js/script.js"></script>
  </body>
</html>
